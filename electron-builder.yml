appId: com.billyhunt.tabula
productName: Tabula
directories:
  buildResources: build
  output: release
files:
  - dist/**
  - dist-electron/**
  - package.json
  # MIT, OFL and Apache-2.0 all require their notices to travel with every
  # redistributed copy, including inside the .app.
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - licenses/**
asar: true
# On macOS electron-builder drops Electron's own licence files, so copy them
# into Resources/ ourselves.
extraResources:
  - from: node_modules/electron/dist/LICENSE
    to: LICENSE.electron.txt
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: LICENSES.chromium.html
# Electron fuses are flipped in the packaged binary before it is signed. They
# close the ways a local process could run its own code under the app's
# signed identity: ELECTRON_RUN_AS_NODE, NODE_OPTIONS and --inspect, or a
# loose app/ directory in place of the validated app.asar. Playwright attaches
# through --inspect, so a packaged end-to-end run needs a build with
# enableNodeCliInspectArguments on (see the README).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Flipping fuses invalidates Electron's ad-hoc signature, and an arm64 binary
  # with a stale signature is killed at launch. Re-sign ad hoc when no real
  # identity signs the bundle afterwards.
  resetAdHocDarwinSignature: true
  # The renderer is served from app://tabula/ and the PDF print window needs no
  # file: subresources, so the file: protocol's extra privileges are not needed.
  grantFileProtocolExtraPrivileges: false
mac:
  category: public.app-category.graphics-design
  target: [dir]
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Hardened runtime and entitlements are what notarization requires. They do
  # nothing to an unsigned build. Whether a build is signed and notarized is
  # decided by the npm script that runs electron-builder (see package.json),
  # not here, so a missing certificate can never fail a local build.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  darkModeSupport: true
# tabula://library#addLibrary=… is how libraries.excalidraw.com hands a
# library back after "Browse libraries" (see src/main/library.ts).
protocols:
  - name: Tabula
    schemes: [tabula]
fileAssociations:
  - ext: [excalidraw]
    name: Excalidraw Drawing
    role: Editor
    mimeType: application/vnd.excalidraw+json
    rank: Owner
  # .excalidraw.md is still .md to macOS. Alternate keeps Tabula under
  # "Open With" without contending with Alethia for markdown.
  - ext: [md]
    name: Markdown Document
    role: Editor
    rank: Alternate
