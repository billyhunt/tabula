name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Tabula is a macOS app, and the end-to-end tests drive the real Electron
    # window, so everything runs on macOS.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Fails when a bundled dependency ships without a licence text, the same
      # check every package build runs.
      - name: Licence texts
        run: npm run licenses

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Keep end-to-end artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
